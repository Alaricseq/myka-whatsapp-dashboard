<!DOCTYPE html>
<html>
<head>
  <title>WhatsApp Automation Dashboard</title>
  <style>
    body { 
      font-family: 'Segoe UI', Arial, sans-serif; 
      background: #f9f9f9; 
      padding: 40px; 
    }
    h2 { 
      color: #007b83; 
      border-bottom: 2px solid #eee; 
      padding-bottom: 6px;
    }
    ul { 
      background: #fff; 
      border-radius: 6px; 
      padding: 20px; 
      box-shadow: 0 2px 6px #eee;
      list-style: none;
    }
    li { 
      margin-bottom: 10px; 
      padding-bottom: 6px; 
      border-bottom: 1px solid #eee;
    }
    a, button {
      display: inline-block;
      color: #fff;
      background: #009688;
      padding: 8px 18px;
      border-radius: 4px;
      text-decoration: none;
      margin-top: 12px;
      border: none;
      transition: background 0.2s;
      font-size: 1em;
    }
    a:hover, button:hover {
      background: #00796b;
      cursor: pointer;
    }
    input {
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #ccc;
      margin-bottom: 10px;
      width: 220px;
      font-size: 1em;
    }
    form {
      background: #fff;
      border-radius: 8px;
      padding: 22px;
      box-shadow: 0 1px 8px #eee;
      max-width: 400px;
      margin-bottom: 18px;
    }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
